name: Build and Test

on:
  push:
    branches: [ main, battle_core ]
  pull_request:
    branches: [ main, battle_core ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # The game tables are not in this repository. When a private repository of them and a
      # read-only deploy key for it are configured, the tests that need them run; otherwise they
      # are skipped, as they are on a pull request from a fork, which gets no secrets.
      # Only whether the key is set, not the key: every step sees the job's environment.
      HAS_GAME_TABLES_KEY: ${{ secrets.GAME_TABLES_KEY != '' }}

    outputs:
      has-game-data: ${{ steps.lock.outputs.available }}

    steps:
      - uses: actions/checkout@v7

      # Code, comments, tests and fixtures describe behaviour in their own words: no hex location
      # references and no assembly snippets.
      - name: Check for hex location references
        run: |
          pattern='0x[c-f][0-9a-f]{5}\b|\b(adrp|blr?|cbn?z|tbn?z|csel|cset|ldp|ldr|ldrb|movk|stp|str|strb|tst) [wx][0-9]+'
          if git grep -nIiP "$pattern" -- . ':!scratch'; then
            echo "::error::hex location references or assembly snippets found (listed above)"
            exit 1
          fi

      # crforge-data.lock pins the data repository's commit, so a change and its data agree. The
      # unit tests pin values of the lock's unitTestVersion, so they read that version's tables.
      - name: Read the data lock
        id: lock
        run: |
          echo "commit=$(sed -n 's/^commit=//p' crforge-data.lock)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^unitTestVersion=//p' crforge-data.lock)" >> "$GITHUB_OUTPUT"
          echo "available=${{ env.HAS_GAME_TABLES_KEY == 'true' && vars.GAME_TABLES_REPOSITORY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check out the game tables
        if: steps.lock.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ steps.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables

      - name: Point the tests at the game tables
        if: steps.lock.outputs.available == 'true'
        run: echo "CRFORGE_GAME_TABLES=${{ github.workspace }}/game-tables/${{ steps.lock.outputs.version }}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run Tests
        run: ./gradlew test

  # Every recorded reference battle at the locked data commit, each case held to
  # parity/reference-expectations/<version>.json, for two data versions of the lock: version, the
  # one under work, and unitTestVersion, kept as a regression set. The cases of each are split
  # across the shards of the matrix.
  reference:
    needs: build
    if: needs.build.outputs.has-game-data == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lock key naming the data version.
        lock-key: [ version, unitTestVersion ]
        shard: [ 0, 1 ]

    env:
      CRFORGE_REFERENCES_SHARD: ${{ matrix.shard }}
      CRFORGE_REFERENCES_SHARDS: 2

    steps:
      - uses: actions/checkout@v7

      - name: Read the data lock
        id: lock
        run: |
          echo "commit=$(sed -n 's/^commit=//p' crforge-data.lock)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^${{ matrix.lock-key }}=//p' crforge-data.lock)" >> "$GITHUB_OUTPUT"

      - name: Check out the game data
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ steps.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables

      - name: Point the reference test at the game data
        run: |
          echo "CRFORGE_GAME_TABLES=${{ github.workspace }}/game-tables/${{ steps.lock.outputs.version }}" >> "$GITHUB_ENV"
          echo "CRFORGE_REFERENCES=${{ github.workspace }}/game-tables/references/${{ steps.lock.outputs.version }}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Run the reference battles
        run: ./gradlew :parity:referenceTest

      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-scorecard-${{ steps.lock.outputs.version }}-${{ matrix.shard }}
          path: parity/build/reference-scorecard/
          if-no-files-found: warn
