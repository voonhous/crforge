name: Build and Test

on:
  push:
    branches: [ main, battle_core ]
  pull_request:
    branches: [ main, battle_core ]

jobs:
  # Reads crforge-data.lock for every other job: the data repository's commit, and the data
  # versions the matrices below run over. Every other job needs only this, so they all start
  # together once it has run (a few seconds), and none waits for another.
  lock:
    runs-on: ubuntu-latest

    env:
      # The game tables are not in this repository. When a private repository of them and a
      # read-only deploy key for it are configured, they are checked out for the tests that need
      # them; otherwise those tests fail, naming the setting, as they do on a pull request from a
      # fork, which gets no secrets.
      # Only whether the key is set, not the key: every step sees the job's environment.
      HAS_GAME_TABLES_KEY: ${{ secrets.GAME_TABLES_KEY != '' }}
      # The same for the coverage dataset's read token (the coverage job).
      HAS_COVERAGE_TOKEN: ${{ secrets.COVERAGE_TOKEN != '' }}

    outputs:
      commit: ${{ steps.lock.outputs.commit }}
      has-game-data: ${{ steps.lock.outputs.available }}
      compatible: ${{ steps.lock.outputs.compatible }}
      others: ${{ steps.lock.outputs.others }}
      coverage-revision: ${{ steps.coverage.outputs.revision }}
      coverage-versions: ${{ steps.coverage.outputs.versions }}
      coverage-parts: ${{ steps.parts.outputs.parts }}
      coverage-sets: ${{ steps.parts.outputs.sets }}
      has-coverage: ${{ steps.coverage.outputs.available }}
      score-coverage: ${{ steps.coverage.outputs.score }}

    steps:
      # The lock files alone.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            crforge-data.lock
            coverage.lock
          sparse-checkout-cone-mode: false

      # crforge-data.lock pins the data repository's commit, so a change and its data agree. The
      # build job runs the unit tests on the tables of the lock's version, built from that commit's
      # copy of the asset files; the data-versions job runs them on the tables of every other
      # compatible version, the reference job runs the reference battles of each compatible
      # version.
      - name: Read the data lock
        id: lock
        run: |
          version=$(sed -n 's/^version=//p' crforge-data.lock)
          compatible=$(sed -n 's/^compatible=//p' crforge-data.lock)
          if ! printf '%s\n' $compatible | grep -qxF "$version"; then
            echo "::error::crforge-data.lock: version $version is not in compatible ($compatible)"
            exit 1
          fi
          echo "commit=$(sed -n 's/^commit=//p' crforge-data.lock)" >> "$GITHUB_OUTPUT"
          echo "compatible=$(printf '%s\n' $compatible | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "others=$(printf '%s\n' $compatible | grep -vxF "$version" | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "available=${{ env.HAS_GAME_TABLES_KEY == 'true' && vars.GAME_TABLES_REPOSITORY != '' }}" >> "$GITHUB_OUTPUT"

      # coverage.lock pins the coverage dataset's revision and names the data versions it has a
      # coverage set of; the coverage job scores each of them.
      # Coverage is scored on a push to battle_core only: a regression, or a set that cannot be
      # scored, fails that run (the badges job), and a pull request's scores would be compared with
      # nothing. The parts are still listed on a pull request (below), which checks the lock: its
      # revision and versions must exist.
      - name: Read the coverage lock
        id: coverage
        run: |
          echo "revision=$(sed -n 's/^revision=//p' coverage.lock)" >> "$GITHUB_OUTPUT"
          echo "versions=$(sed -n 's/^versions=//p' coverage.lock | tr ' ' '\n' | grep . | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "available=${{ env.HAS_COVERAGE_TOKEN == 'true' && vars.COVERAGE_DATASET != '' }}" >> "$GITHUB_OUTPUT"
          echo "score=${{ github.event_name == 'push' && github.ref == 'refs/heads/battle_core' }}" >> "$GITHUB_OUTPUT"

      # Each version's set is scored part by part, one coverage job per part file: its corpus.json
      # (small) names the parts. A set's id is the hash of its parts' sha256 (so a lock move that
      # leaves a version's battles as they are keeps its id); the badges job compares a score only
      # with a published score of the same set.
      - name: List the coverage parts
        id: parts
        if: steps.coverage.outputs.available == 'true'
        env:
          TOKEN: ${{ secrets.COVERAGE_TOKEN }}
          DATASET: ${{ vars.COVERAGE_DATASET }}
          REVISION: ${{ steps.coverage.outputs.revision }}
          VERSIONS: ${{ steps.coverage.outputs.versions }}
        run: |
          set -euo pipefail
          parts='[]'
          sets='{}'
          for version in $(jq -r '.[]' <<< "$VERSIONS"); do
            listing=$(curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" \
              "https://huggingface.co/datasets/$DATASET/resolve/$REVISION/coverage/$version/corpus.json")
            count=$(jq '.parts | length' <<< "$listing")
            id=$(jq -r '[.parts[].sha256] | join(",")' <<< "$listing" | sha256sum | cut -c1-16)
            parts=$(jq -c --arg v "$version" --argjson n "$count" '. + [range($n) | {version: $v, part: .}]' <<< "$parts")
            sets=$(jq -c --arg v "$version" --arg id "$id" '. + {($v): $id}' <<< "$sets")
          done
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
          echo "sets=$sets" >> "$GITHUB_OUTPUT"

  # The address check, the build with its checks, and the unit tests on the tables of the lock's
  # version.
  build:
    needs: lock
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Code, comments, tests and fixtures describe behaviour in their own words: no hex location
      # references and no assembly snippets.
      - name: Check for hex location references
        run: |
          pattern='0x[c-f][0-9a-f]{5}\b|\b(adrp|blr?|cbn?z|tbn?z|csel|cset|ldp|ldr|ldrb|movk|stp|str|strb|tst) [wx][0-9]+'
          if git grep -nIiP "$pattern" -- . ':!scratch'; then
            echo "::error::hex location references or assembly snippets found (listed above)"
            exit 1
          fi

      - name: Check out the game tables
        if: needs.lock.outputs.has-game-data == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ needs.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables

      # The build makes the game tables the tests read from the repository's copy of the game's
      # asset files (cdn/), never from the game's CDN. The table decoder's test also holds them to
      # the repository's tables byte for byte.
      - name: Point the build at the game data
        if: needs.lock.outputs.has-game-data == 'true'
        run: echo "CRFORGE_DATA_ARGS=-Pcrforge.assetSource=file://${{ github.workspace }}/game-tables/cdn/ -Pcrforge.dataRoot=${{ github.workspace }}/game-tables" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          # The action writes its cache on the default branch only; battle_core is where the work
          # lands, so its pushes write it too, and pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/battle_core' }}

      - name: Build with Gradle
        run: ./gradlew build $CRFORGE_DATA_ARGS

      - name: Run Tests
        run: ./gradlew test $CRFORGE_DATA_ARGS

  # The Python package (python/) on the env module's installed jars: its lint and its tests, the
  # Ladder tests on the tables of the lock's version, built from the data repository's copy of the
  # asset files as the build job builds them (never the game's CDN). Without the game data (a pull
  # request from a fork) only the tests that need no tables run.
  python:
    needs: lock
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out the game tables
        if: needs.lock.outputs.has-game-data == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ needs.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables
          sparse-checkout: cdn

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/battle_core' }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      # The env module's jars under env/build/install/env, and with the game data the tables of the
      # lock's version in a cache of the job's own.
      - name: Install the env module and build the tables
        run: |
          if [ "${{ needs.lock.outputs.has-game-data }}" = true ]; then
            version=$(sed -n 's/^version=//p' crforge-data.lock)
            ./gradlew :env:installDist :tables:dataVersionTables \
              -Pcrforge.assetSource=file://${{ github.workspace }}/game-tables/cdn/ \
              -Pcrforge.cache=${{ github.workspace }}/crforge-cache
            echo "TABLES_ARG=--tables=${{ github.workspace }}/crforge-cache/tables/$version" >> "$GITHUB_ENV"
          else
            ./gradlew :env:installDist
          fi

      - name: Lint and test the Python package
        working-directory: python
        run: |
          uv sync --locked --extra dev
          uv run ruff check
          uv run ruff format --check
          uv run pytest -rs --install=${{ github.workspace }}/env/build/install/env $TABLES_ARG

  # The unit tests on the tables of every compatible data version other than the lock's version,
  # which the build job covers. The versions share the client's battle rules and the tests pin no
  # game data, so they pass on each one unchanged.
  data-versions:
    needs: lock
    if: needs.lock.outputs.has-game-data == 'true' && needs.lock.outputs.others != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.lock.outputs.others) }}

    steps:
      - uses: actions/checkout@v7

      - name: Check out the game tables
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ needs.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/battle_core' }}

      - name: Run Tests
        run: ./gradlew test -Pcrforge.dataVersion=${{ matrix.version }} -Pcrforge.assetSource=file://${{ github.workspace }}/game-tables/cdn/

  # Every recorded reference battle of each compatible data version at the locked data commit, each
  # case held to conformance/reference-expectations/<version>.json. A version without recorded
  # references is skipped. The cases of a version are split across the shards of the matrix; each
  # shard builds the tables of its version alone.
  reference:
    needs: lock
    if: needs.lock.outputs.has-game-data == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.lock.outputs.compatible) }}
        shard: [ 0, 1 ]

    steps:
      - uses: actions/checkout@v7

      - name: Check out the game data
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ needs.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables

      - name: Point the reference test at the game data
        id: references
        run: |
          if [ ! -d "game-tables/references/${{ matrix.version }}" ]; then
            echo "::notice::no reference battles of data version ${{ matrix.version }} at the locked commit; skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.references.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.references.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/battle_core' }}

      - name: Run the reference battles
        if: steps.references.outputs.present == 'true'
        run: >-
          ./gradlew :conformance:referenceTest
          -Pcrforge.dataVersion=${{ matrix.version }}
          -Pcrforge.assetSource=file://${{ github.workspace }}/game-tables/cdn/
          -Pcrforge.references=${{ github.workspace }}/game-tables/references/${{ matrix.version }}
          -Pcrforge.references.shard=${{ matrix.shard }}
          -Pcrforge.references.shards=2

      - name: Upload the scorecard
        if: always() && steps.references.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reference-scorecard-${{ matrix.version }}-${{ matrix.shard }}
          path: conformance/build/reference-scorecard/
          if-no-files-found: warn

  # The coverage score of each data version coverage.lock names: every battle of its coverage set, a
  # large sample of the game's own recorded battles of that version, played on the battle core and
  # compared tick by tick. A measurement, never a gate: these jobs cannot fail the run, and they
  # print and keep the totals only, never a battle. Each job plays one part file of a set and keeps
  # its tally; the coverage-merge job sums a version's tallies into its score.
  coverage:
    needs: lock
    if: >-
      needs.lock.outputs.has-game-data == 'true' && needs.lock.outputs.has-coverage == 'true'
      && needs.lock.outputs.score-coverage == 'true' && needs.lock.outputs.coverage-parts != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.lock.outputs.coverage-parts) }}

    steps:
      - uses: actions/checkout@v7

      # The game's asset files only: the build makes the version's tables from them.
      - name: Check out the game data
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ needs.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables
          sparse-checkout: cdn

      # The set's corpus.json and this job's part at the locked revision, the part checked against
      # the sha256 corpus.json gives, unpacked into a references folder (corpora/ and battles/).
      - name: Download the coverage part
        env:
          TOKEN: ${{ secrets.COVERAGE_TOKEN }}
          DATASET: ${{ vars.COVERAGE_DATASET }}
          REVISION: ${{ needs.lock.outputs.coverage-revision }}
          VERSION: ${{ matrix.version }}
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          base="https://huggingface.co/datasets/$DATASET/resolve/$REVISION/coverage/$VERSION"
          # A large file answers with a redirect to the dataset's storage: follow it (curl sends the
          # token to the dataset's host only).
          get() { curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" -o "$2" "$base/$1"; }
          mkdir -p coverage/corpora
          get corpus.json coverage/corpus.json
          file=$(jq -r --argjson k "$PART" '.parts[$k].file' coverage/corpus.json)
          sha=$(jq -r --argjson k "$PART" '.parts[$k].sha256' coverage/corpus.json)
          get "$file" "coverage/$file"
          echo "$sha  coverage/$file" | sha256sum -c --quiet
          tar -xf "coverage/$file" -C coverage
          rm "coverage/$file"
          mv coverage/corpus.json "coverage/corpora/coverage-$VERSION.json"
          echo "part $PART: $(jq --argjson k "$PART" '.parts[$k].battles' "coverage/corpora/coverage-$VERSION.json") battles"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/battle_core' }}

      - name: Score the coverage part
        run: >-
          ./gradlew :conformance:coverageScore
          -Pcrforge.dataVersion=${{ matrix.version }}
          -Pcrforge.assetSource=file://${{ github.workspace }}/game-tables/cdn/
          -Pcrforge.coverage=${{ github.workspace }}/coverage
          -Pcrforge.coverage.part=${{ matrix.part }}

      - name: Upload the tally
        uses: actions/upload-artifact@v7
        with:
          name: coverage-tally-${{ matrix.version }}-${{ matrix.part }}
          path: conformance/build/coverage/tally-*.json
          if-no-files-found: error

  # Sums the tallies of each version's parts into its score and badge, as one run over the whole set
  # would. A version missing a part's tally is not scored, so a partial score is never published.
  coverage-merge:
    needs: [ lock, coverage ]
    if: always() && needs.coverage.result != 'skipped'
    runs-on: ubuntu-latest
    continue-on-error: true

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.lock.outputs.coverage-versions) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-tally-${{ matrix.version }}-*
          merge-multiple: true
          path: tallies

      - name: Check every part's tally is there
        env:
          PARTS: ${{ needs.lock.outputs.coverage-parts }}
          VERSION: ${{ matrix.version }}
        run: |
          expected=$(jq --arg v "$VERSION" '[.[] | select(.version == $v)] | length' <<< "$PARTS")
          found=$(ls tallies/tally-*.json 2>/dev/null | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "::warning::coverage of $VERSION: $found of $expected parts scored; no score this run"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.ref != 'refs/heads/battle_core' }}

      - name: Sum the tallies
        run: ./gradlew :conformance:coverageMerge -Pcrforge.coverage.tallies=${{ github.workspace }}/tallies

      - name: Upload the score
        uses: actions/upload-artifact@v7
        with:
          name: coverage-score-${{ matrix.version }}
          path: |
            conformance/build/coverage/score-*.json
            conformance/build/coverage/badge-*.json
          if-no-files-found: error

  # Records each version's score of this commit on the badges branch (history/<commit>/), after a
  # push to battle_core only, and checks it against the scored commits next to it in battle_core's
  # history: the nearest older one and, when this run finishes after a newer commit's, the nearest
  # newer one. So every pair of neighbouring scored commits is compared, whichever run finishes
  # last, and a rerun of a commit left unscored (a failed run) closes the gap and checks both of its
  # sides. A pair across unscored commits is named in a notice. The run fails when a version's share
  # of battles reproduced to the end dropped between two scored commits of the same set, or when a
  # version coverage.lock lists got no score (a part not scored), so a regression or a set that
  # cannot be scored shows as a failed run on battle_core. The scores and shields.io badges at the
  # branch's root (the README's coverage badges) are always those of the newest scored commit, so a
  # late run or a rerun of an older commit never takes them back. The only coverage job that can
  # fail the run.
  badges:
    needs: [ lock, coverage-merge ]
    if: >-
      always() && needs.coverage-merge.result != 'skipped'
      && github.event_name == 'push' && github.ref == 'refs/heads/battle_core'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No concurrency group: GitHub keeps one waiting job of a group and cancels the others, which
    # would leave commits of a backlog unscored. Runs that publish at the same time retry the push
    # on the moved branch instead.

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-score-*
          merge-multiple: true
          path: scores

      - name: Record the scores and check them against their neighbours
        env:
          TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SETS: ${{ needs.lock.outputs.coverage-sets }}
          VERSIONS: ${{ needs.lock.outputs.coverage-versions }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          short() { echo "${1::8}"; }
          dropped=0
          for version in $(jq -r '.[]' <<< "$VERSIONS"); do
            if [ ! -f "scores/score-$version.json" ]; then
              echo "::error::coverage of $version: no score at $(short "$GITHUB_SHA") (a part was not scored)"
              dropped=1
            fi
          done
          # This commit's record: each score naming its set and commit, and its badge.
          mkdir record
          for score in scores/score-*.json; do
            version=$(jq -r .content_version "$score")
            set_id=$(jq -r --arg v "$version" '.[$v] // ""' <<< "$SETS")
            jq --arg set "$set_id" --arg commit "$GITHUB_SHA" '. + {set: $set, commit: $commit}' "$score" > "record/score-$version.json"
            cp "scores/badge-$version.json" record/
          done
          # Checks the version's score file $2 (named $4) against the older $1 (named $3), $5 unscored
          # commits between them.
          check() {
            local set before now
            set=$(jq -r '.set // ""' "$1")
            if [ -z "$set" ] || [ "$set" != "$(jq -r '.set // ""' "$2")" ]; then
              echo "::notice::coverage of $version: $4 is of another set than $3 (or names none); not compared"
              return
            fi
            before=$(jq -r .to_the_end "$1")
            now=$(jq -r .to_the_end "$2")
            if [ "$(jq -n --argjson now "$now" --argjson before "$before" '$now < $before')" = true ]; then
              echo "::error::coverage of $version dropped at $4: $before% at $3 -> $now% of battles reproduced to the end$( [ "$5" -eq 0 ] || echo " (in one of the $(($5 + 1)) commits after $3: rerun the unscored ones to find it)")"
            elif [ "$5" -gt 0 ]; then
              echo "::notice::coverage of $version: $4 compared with $3 across $5 unscored commit$( [ "$5" -eq 1 ] || echo s); rerun their runs to check each"
            fi
          }
          # Checks the version's scores of two scored commits, $1 older than $2, in commits order.
          compare() {
            local gap
            gap=$(sed -n "/^$2\$/,/^$1\$/p" ../commits | sed '1d;$d' | grep -c . || true)
            check "history/$1/score-$version.json" "history/$2/score-$version.json" "$(short "$1")" "$(short "$2")" "$gap"
          }
          git init -q badges
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:$TOKEN@github.com/$REPOSITORY.git"
          for attempt in 1 2 3 4 5; do
            if git fetch -q --depth 1 origin badges; then
              git checkout -q -f -B badges FETCH_HEAD
            else
              git checkout -q --orphan "badges-$attempt" && git read-tree --empty
            fi
            git clean -qfdx
            # The root's scores as published before this run: those of before the history began
            # name no commit.
            rm -rf ../published && mkdir ../published
            cp score-*.json ../published/ 2>/dev/null || true
            mkdir -p "history/$GITHUB_SHA"
            cp ../record/* "history/$GITHUB_SHA/" 2>/dev/null || true
            # battle_core's recent commits, newest first (squash merges: one line of history).
            gh api "repos/$REPOSITORY/commits?sha=battle_core&per_page=100" --jq '.[].sha' > ../commits
            : > ../messages
            if ! grep -qxF "$GITHUB_SHA" ../commits; then
              echo "::notice::$(short "$GITHUB_SHA") is not among the last 100 commits of battle_core; its scores are neither compared nor kept" >> ../messages
            fi
            for version in $(jq -r '.[]' <<< "$VERSIONS"); do
              scored=()
              while read -r sha; do
                if [ -f "history/$sha/score-$version.json" ]; then scored+=("$sha"); fi
              done < ../commits
              if [ "${#scored[@]}" -eq 0 ]; then continue; fi
              # The root's score and badge: the newest scored commit's.
              cp "history/${scored[0]}/score-$version.json" "history/${scored[0]}/badge-$version.json" .
              for i in "${!scored[@]}"; do
                if [ "${scored[$i]}" != "$GITHUB_SHA" ]; then continue; fi
                if [ "$((i + 1))" -lt "${#scored[@]}" ]; then
                  compare "${scored[$((i + 1))]}" "$GITHUB_SHA" >> ../messages
                elif [ -f "../published/score-$version.json" ] && [ -z "$(jq -r '.commit // ""' "../published/score-$version.json")" ]; then
                  # The first scored commit of the history: the score published before it is the older one.
                  check "../published/score-$version.json" "history/$GITHUB_SHA/score-$version.json" "the last published score" "$(short "$GITHUB_SHA")" 0 >> ../messages
                else
                  echo "::notice::coverage of $version: no older scored commit among the last 100 of battle_core; not compared" >> ../messages
                fi
                if [ "$i" -gt 0 ]; then compare "$GITHUB_SHA" "${scored[$((i - 1))]}" >> ../messages; fi
              done
            done
            # Only the records of the last 100 commits are kept, the ones a run compares; each run is
            # a commit of this branch, so an older score stays in its history.
            for record in history/*/; do
              if ! grep -qxF "$(basename "$record")" ../commits; then rm -rf "$record"; fi
            done
            git add -A
            if git diff --cached --quiet; then
              echo "no change"
              break
            fi
            git commit -q -m "Coverage scores of $(short "$GITHUB_SHA")"
            if git push -q origin HEAD:badges; then break; fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::the badges branch kept moving; nothing published"
              exit 1
            fi
            echo "the badges branch moved; trying again"
            sleep $((attempt * 5))
          done
          cat ../messages
          if grep -q '^::error::' ../messages; then dropped=1; fi
          exit "$dropped"
