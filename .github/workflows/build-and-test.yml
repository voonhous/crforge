name: Build and Test

on:
  push:
    branches: [ main, battle_core ]
  pull_request:
    branches: [ main, battle_core ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # The game tables are not in this repository. When a private repository of them and a
      # read-only deploy key for it are configured, they are checked out for the tests that need
      # them; otherwise those tests fail, naming the setting, as they do on a pull request from a
      # fork, which gets no secrets.
      # Only whether the key is set, not the key: every step sees the job's environment.
      HAS_GAME_TABLES_KEY: ${{ secrets.GAME_TABLES_KEY != '' }}

    outputs:
      has-game-data: ${{ steps.lock.outputs.available }}
      compatible: ${{ steps.lock.outputs.compatible }}
      others: ${{ steps.lock.outputs.others }}

    steps:
      - uses: actions/checkout@v7

      # Code, comments, tests and fixtures describe behaviour in their own words: no hex location
      # references and no assembly snippets.
      - name: Check for hex location references
        run: |
          pattern='0x[c-f][0-9a-f]{5}\b|\b(adrp|blr?|cbn?z|tbn?z|csel|cset|ldp|ldr|ldrb|movk|stp|str|strb|tst) [wx][0-9]+'
          if git grep -nIiP "$pattern" -- . ':!scratch'; then
            echo "::error::hex location references or assembly snippets found (listed above)"
            exit 1
          fi

      # crforge-data.lock pins the data repository's commit, so a change and its data agree. This
      # job runs the unit tests on the tables of the lock's version, built from that commit's copy
      # of the asset files; the data-versions job runs
      # them on the tables of every other compatible version, the reference job runs the
      # reference battles of each compatible version.
      - name: Read the data lock
        id: lock
        run: |
          version=$(sed -n 's/^version=//p' crforge-data.lock)
          compatible=$(sed -n 's/^compatible=//p' crforge-data.lock)
          if ! printf '%s\n' $compatible | grep -qxF "$version"; then
            echo "::error::crforge-data.lock: version $version is not in compatible ($compatible)"
            exit 1
          fi
          echo "commit=$(sed -n 's/^commit=//p' crforge-data.lock)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "compatible=$(printf '%s\n' $compatible | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "others=$(printf '%s\n' $compatible | grep -vxF "$version" | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
          echo "available=${{ env.HAS_GAME_TABLES_KEY == 'true' && vars.GAME_TABLES_REPOSITORY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check out the game tables
        if: steps.lock.outputs.available == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ steps.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables

      # The build makes the game tables the tests read from the repository's copy of the game's
      # asset files (cdn/), never from the game's CDN. The table decoder's test also holds them to
      # the repository's tables byte for byte.
      - name: Point the build at the game data
        if: steps.lock.outputs.available == 'true'
        run: echo "CRFORGE_DATA_ARGS=-Pcrforge.assetSource=file://${{ github.workspace }}/game-tables/cdn/ -Pcrforge.dataRoot=${{ github.workspace }}/game-tables" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Build with Gradle
        run: ./gradlew build $CRFORGE_DATA_ARGS

      - name: Run Tests
        run: ./gradlew test $CRFORGE_DATA_ARGS

  # The unit tests on the tables of every compatible data version other than the lock's version,
  # which the build job covers. The versions share the client's battle rules and the tests pin no
  # game data, so they pass on each one unchanged.
  data-versions:
    needs: build
    if: needs.build.outputs.has-game-data == 'true' && needs.build.outputs.others != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.build.outputs.others) }}

    steps:
      - uses: actions/checkout@v7

      - name: Read the data lock
        id: lock
        run: echo "commit=$(sed -n 's/^commit=//p' crforge-data.lock)" >> "$GITHUB_OUTPUT"

      - name: Check out the game tables
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ steps.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables


      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Run Tests
        run: ./gradlew test -Pcrforge.dataVersion=${{ matrix.version }} -Pcrforge.assetSource=file://${{ github.workspace }}/game-tables/cdn/

  # Every recorded reference battle of each compatible data version at the locked data commit, each
  # case held to conformance/reference-expectations/<version>.json. A version without recorded
  # references is skipped. The cases of a version are split across the shards of the matrix.
  reference:
    needs: build
    if: needs.build.outputs.has-game-data == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.build.outputs.compatible) }}
        shard: [ 0, 1 ]

    steps:
      - uses: actions/checkout@v7

      - name: Read the data lock
        id: lock
        run: echo "commit=$(sed -n 's/^commit=//p' crforge-data.lock)" >> "$GITHUB_OUTPUT"

      - name: Check out the game data
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ref: ${{ steps.lock.outputs.commit }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables

      - name: Point the reference test at the game data
        id: references
        run: |
          if [ ! -d "game-tables/references/${{ matrix.version }}" ]; then
            echo "::notice::no reference battles of data version ${{ matrix.version }} at the locked commit; skipped"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.references.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.references.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Run the reference battles
        if: steps.references.outputs.present == 'true'
        run: >-
          ./gradlew :conformance:referenceTest
          -Pcrforge.dataVersion=${{ matrix.version }}
          -Pcrforge.assetSource=file://${{ github.workspace }}/game-tables/cdn/
          -Pcrforge.references=${{ github.workspace }}/game-tables/references/${{ matrix.version }}
          -Pcrforge.references.shard=${{ matrix.shard }}
          -Pcrforge.references.shards=2

      - name: Upload the scorecard
        if: always() && steps.references.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reference-scorecard-${{ matrix.version }}-${{ matrix.shard }}
          path: conformance/build/reference-scorecard/
          if-no-files-found: warn
