name: Build and Test

on:
  push:
    branches: [ main, battle_core ]
  pull_request:
    branches: [ main, battle_core ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # The game tables are not in this repository. When a private repository of them and a
      # read-only deploy key for it are configured, the tests that need them run; otherwise they
      # are skipped, as they are on a pull request from a fork, which gets no secrets.
      # Only whether the key is set, not the key: every step sees the job's environment.
      HAS_GAME_TABLES_KEY: ${{ secrets.GAME_TABLES_KEY != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Check out the game tables
        if: env.HAS_GAME_TABLES_KEY == 'true' && vars.GAME_TABLES_REPOSITORY != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.GAME_TABLES_REPOSITORY }}
          ssh-key: ${{ secrets.GAME_TABLES_KEY }}
          path: game-tables

      - name: Point the tests at the game tables
        if: env.HAS_GAME_TABLES_KEY == 'true' && vars.GAME_TABLES_REPOSITORY != ''
        run: echo "CRFORGE_GAME_TABLES=${{ github.workspace }}/game-tables/${{ vars.GAME_TABLES_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run Tests
        run: ./gradlew test
