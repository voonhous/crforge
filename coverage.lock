# The coverage sets CI scores: each a large sample of the game's own recorded battles of one data
# version, played on the battle core and compared tick by tick (conformance/README.md, Coverage).
# They live in the coverage dataset (the COVERAGE_DATASET variable, read with the COVERAGE_TOKEN
