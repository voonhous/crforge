<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="400" viewBox="0 0 1160 400" role="img" aria-label="An example battle: one scenario, the game client's trace on disk, crforge's trace in memory, compared">
<title>An example battle: one scenario, the game client's trace on disk, crforge's trace in memory, compared</title>
<defs>
<marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
<style>.s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; white-space:pre}</style>
</defs>
<rect x="0" y="0" width="1160" height="400" rx="12" fill="#ffffff"/>
<text x="30" y="34" class="s" font-size="18" font-weight="600" fill="#1f2328">One example battle: examples/VERSION/battles/BATTLE/</text>
<rect x="30" y="160" width="210" height="95" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="42" y="187" class="m" font-size="15" font-weight="600" fill="#424a53">scenario.json</text>
<text x="42" y="209" class="s" font-size="13.5" fill="#424a53">the battle's input: decks,</text>
<text x="42" y="227" class="s" font-size="13.5" fill="#424a53">levels, every play, the seed</text>
<text x="42" y="245" class="s" font-size="13.5" fill="#424a53">(a replay the viewer opens)</text>
<rect x="300" y="70" width="230" height="77" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="312" y="97" class="m" font-size="15" font-weight="600" fill="#424a53">The game client</text>
<text x="312" y="119" class="s" font-size="13.5" fill="#424a53">plays the battle once,</text>
<text x="312" y="137" class="s" font-size="13.5" fill="#424a53">on the version's own data</text>
<rect x="600" y="70" width="250" height="77" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="612" y="97" class="m" font-size="15" font-weight="600" fill="#424a53">observations.jsonl.zst</text>
<text x="612" y="119" class="s" font-size="13.5" fill="#424a53">the game client's trace:</text>
<text x="612" y="137" class="s" font-size="13.5" fill="#424a53">one line a tick, committed</text>
<text x="612" y="165" class="s" font-size="12" font-style="italic" fill="#57606a">reference.json: its length, end tick, hashes</text>
<rect x="300" y="280" width="230" height="77" rx="8" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
<text x="312" y="307" class="m" font-size="15" font-weight="600" fill="#0550ae">The battle core</text>
<text x="312" y="329" class="s" font-size="13.5" fill="#424a53">plays the same battle,</text>
<text x="312" y="347" class="s" font-size="13.5" fill="#424a53">on the same tables</text>
<rect x="600" y="280" width="250" height="77" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="612" y="307" class="m" font-size="15" font-weight="600" fill="#1f2328">crforge's trace</text>
<text x="612" y="329" class="s" font-size="13.5" fill="#424a53">built in memory on every</text>
<text x="612" y="347" class="s" font-size="13.5" fill="#424a53">run, never written</text>
<rect x="920" y="165" width="220" height="93" rx="8" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
<text x="932" y="190" class="m" font-size="13" font-weight="600" fill="#116329">:conformance:coverageScore</text>
<text x="932" y="212" class="s" font-size="13.5" fill="#424a53">compares the two traces</text>
<text x="932" y="230" class="s" font-size="13.5" fill="#424a53">observation by observation,</text>
<text x="932" y="248" class="s" font-size="13.5" fill="#424a53">no tolerance</text>
<rect x="920" y="308" width="220" height="59" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="932" y="335" class="m" font-size="15" font-weight="600" fill="#424a53">score-VERSION.json</text>
<text x="932" y="357" class="s" font-size="13.5" fill="#424a53">to_the_end, ticks_agreed</text>
<polyline points="240,208 265,208 265,108 298,108" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#head)"/>
<polyline points="240,208 265,208 265,318 298,318" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#head)"/>
<polyline points="530,108 598,108" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="564" y="100" class="s" font-size="12" font-style="italic" text-anchor="middle" fill="#57606a">recorded once</text>
<polyline points="530,318 598,318" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="564" y="310" class="s" font-size="12" font-style="italic" text-anchor="middle" fill="#57606a">every run</text>
<polyline points="850,108 885,108 885,200 918,200" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#head)"/>
<polyline points="850,318 885,318 885,224 918,224" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#head)"/>
<polyline points="1030,258 1030,306" fill="none" stroke="#57606a" stroke-width="1.6" marker-end="url(#head)"/>
<text x="1040" y="286" class="s" font-size="12" font-style="italic" fill="#57606a">writes</text>
</svg>
